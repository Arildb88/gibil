<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gibil Live Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;background:#0d1826;color:#e9f2fa;font:15px system-ui,sans-serif}
header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
h1{font-size:22px;margin:0}#stats{display:flex;gap:18px;flex-wrap:wrap}#stats strong{color:#72d9f7}
#map{height:calc(100vh - 150px);min-height:520px;background:#162638;flex:1;min-width:0}#workspace{display:flex;align-items:stretch}#sidebar{width:420px;max-width:40vw;display:flex;flex-direction:column;background:#0d1826}#sidebar .table-wrap{max-height:calc(100vh - 290px)}#sidebar .panel{padding:14px 16px}.legend{gap:10px!important}@media(max-width:850px){#workspace{flex-direction:column}#sidebar{width:100%;max-width:none}#map{height:55vh;min-height:350px}#sidebar .table-wrap{max-height:320px}}
.panel{padding:16px 24px}.panel h2{margin:0 0 12px;font-size:18px}.legend{display:flex;gap:20px;flex-wrap:wrap;align-items:center}.badge{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid white;vertical-align:middle;margin-right:6px}.badge.ok{background:#26b87a}.badge.error{background:#e45555}.badge.pending{background:#8997a7}.badge.changed{background:#31b8ff;box-shadow:0 0 0 4px #31b8ff44}.table-wrap{max-height:32vh;overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:9px 12px;border-bottom:1px solid #32465a}th{position:sticky;top:0;background:#142437}tr:hover{background:#1b3146}#countdown{color:#72d9f7;font-weight:bold}
footer{padding:12px 24px;font-size:13px;color:#b7c6d5}
.leaflet-popup-content{color:#172334}.airport-dot{border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px #0008}
.airport-dot.pending{background:#8997a7}.airport-dot.ok{background:#26b87a}.airport-dot.error{background:#e45555}
.airport-dot.changed{animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 0 11px #31b8ff44}}
</style></head><body>
<header><h1>✈ Gibil Live Monitor</h1><div id="stats" aria-live="polite">Venter på data …</div></header>
<div id="workspace"><div id="map" role="region" aria-label="Kart over flyplasser i Norge"></div><aside id="sidebar">
<section class="panel"><div class="legend"><span><i class="badge pending"></i>Venter</span><span><i class="badge ok"></i>Hentet OK</span><span><i class="badge error"></i>Feil</span><span><i class="badge changed"></i>Berørt av endring</span><span>Neste planlagte polling: <span id="countdown">–</span></span></div></section>
<section class="panel"><h2>Flyplassoversikt</h2><div class="table-wrap"><table><thead><tr><th>Flyplass</th><th>Status</th><th>Sist forsøkt hentet</th><th>Berørte endringer</th></tr></thead><tbody id="airport-rows"></tbody></table></div></section></aside></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/monitor/monitor.js"></script></body></html>
